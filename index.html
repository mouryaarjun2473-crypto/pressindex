<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PressIndex – Curated Blog Atlas &amp; In-Site Reader</title>
    <meta
      name="description"
      content="Explore, search, and read 30 iconic blogs including Kottke, Smashing Magazine, Labnol, ProBlogger, and Instructables inside PressIndex."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PressIndex" />
    <meta property="og:title" content="PressIndex – Curated Blog Atlas &amp; In-Site Reader" />
    <meta
      property="og:description"
      content="Explore, search, and read 30 iconic blogs including Kottke, Smashing Magazine, Labnol, ProBlogger, and Instructables inside PressIndex."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PressIndex – Curated Blog Atlas &amp; In-Site Reader" />
    <meta
      name="twitter:description"
      content="Explore, search, and read 30 iconic blogs including Kottke, Smashing Magazine, Labnol, ProBlogger, and Instructables inside PressIndex."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PressIndex",
        "description": "Curated editorial directory, live in-site reader, and topic search portal for 30 iconic blogs and independent publications.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#FAF9F6] text-[#141413] antialiased selection:bg-[#1E3A8A]/15 selection:text-[#1E3A8A]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
